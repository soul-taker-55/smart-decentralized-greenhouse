services:
  sdigf-bridge:
    build: .
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_CLIENT_ID: sdigf-bridge

      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}

      GH_ID: gh1
      LOG_LEVEL: info
      MAX_QUEUE_DEPTH: 5000
      DEDUP_WINDOW_MIN: 60
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
