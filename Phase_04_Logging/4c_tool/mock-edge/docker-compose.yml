services:
  sdigf-mock-edge:
    build: .
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_CLIENT_ID: sdigf-mock-edge
      GH_ID: gh1
      FW_VERSION: mock-0.1.0
      TELEMETRY_INTERVAL_S: 10
      HEALTH_INTERVAL_S: 60
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
