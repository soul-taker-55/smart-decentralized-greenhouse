version: '3.8'

# Smart Decentralized Greenhouse (SDIGF) — Complete Server Tier (Phase 4)
# Contains:
#   - sdigf-db: PostgreSQL 16 + TimescaleDB (auto-init schema from GitHub)
#   - sdigf-mosquitto: Mosquitto MQTT broker with persistence
# Network: joins dokploy-network for inter-service discovery
# Volumes: sdigf_db_data and sdigf_mosquitto_data (both S3-backupable)

services:
  # ============================================================================
  # DATABASE: PostgreSQL 16 + TimescaleDB
  # ============================================================================
  sdigf-db:
    image: postgres:16-alpine
    container_name: sdigf-db
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{POSTGRES_PASSWORD}}
      POSTGRES_DB: sdigf_db
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    
    volumes:
      # Data persistence (named volume for Dokploy backups)
      - sdigf_db_data:/var/lib/postgresql/data
      
      # Init script: downloads schema from GitHub on first boot
      # Postgres auto-runs *.sql and *.sh files in /docker-entrypoint-initdb.d/ in alphabetical order
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-schema.sh:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdigf_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - dokploy-network

  # ============================================================================
  # MQTT BROKER: Mosquitto
  # ============================================================================
  sdigf-mosquitto:
    image: eclipse-mosquitto:2
    container_name: sdigf-mosquitto
    restart: unless-stopped
    
    ports:
      # 1883: MQTT plaintext (LAN-only for PoC; TLS on 8883 in production)
      - "1883:1883"
    
    volumes:
      # Configuration (read-only from repo)
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      
      # User credentials (generated on-server via mosquitto_passwd)
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      
      # Persistence: retained messages and QoS queues survive restarts
      - sdigf_mosquitto_data:/mosquitto/data
    
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$SYS/broker/version", "-W", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - dokploy-network
    
    depends_on:
      - sdigf-db

volumes:
  sdigf_db_data:
    driver: local
  sdigf_mosquitto_data:
    driver: local

networks:
  dokploy-network:
    external: true
