# Mosquitto Configuration for Smart Decentralized Greenhouse (SDIGF)
# Phase 4: Basic auth + persistence. Phase 6: ACL-per-user.

# ============================================================================
# LISTENER: MQTT (plaintext, LAN-only for PoC)
# ============================================================================

listener 1883
protocol mqtt

# Bind to all interfaces (Dokploy will handle port exposure)
# For production on a VPS, restrict to localhost and use TLS on 8883 instead

# ============================================================================
# AUTHENTICATION & ACL
# ============================================================================

# Require authentication (deny anonymous)
allow_anonymous false

# Password file: username:hashed_password (generated with mosquitto_passwd)
password_file /mosquitto/config/passwd

# ACL file (added in Phase 6)
# acl_file /mosquitto/config/acl

# ============================================================================
# PERSISTENCE
# ============================================================================

# Enable persistence of retained messages and QoS queues
persistence true

# Location of persistence database
persistence_location /mosquitto/data/

# Auto-save interval: write to disk every 60 seconds (vs. only on clean shutdown)
# Balances durability vs. write load; 60s tolerance is acceptable for config changes
autosave_interval 60

# Retain offline persistent clients' messages for 30 days
# (a reconnecting ESP32 drops its session and resubscribes; this timeout is long
#  so we don't lose config if the edge is down for weeks during testing)
persistent_client_expiration 30d

# ============================================================================
# QUEUE & MESSAGE LIMITS
# ============================================================================

# Max queued messages per client (default 1000)
# Enough for config + command history during a WiFi dropout
max_queued_messages 1000

# ============================================================================
# LOGGING
# ============================================================================

# Log to stdout (captured by Docker logs)
log_dest stdout

# Log level: only errors and warnings during normal operation
log_type error
log_type warning
log_type notice

# Connection logging (useful for debugging reconnects)
# Uncomment during Phase 2 bringup to trace ESP32 MQTT interactions
# connection_messages true

# ============================================================================
# PERFORMANCE
# ============================================================================

# Max connections (default 4096; we only have 1 edge + 1 bridge + 1 backend)
max_connections -1

# Max inflight messages (default 20; enough for our low-volume operations)
max_inflight_messages 20
