; Reference build configuration. Flashing is currently done via Arduino IDE
; with equivalent settings (see 6a_cam_firmware/README.md).
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
src_dir = cam_bringup